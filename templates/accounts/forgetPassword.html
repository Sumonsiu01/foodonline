{% extends 'base.html' %}

{% block content %}
<div class="main-section">
    <div class="page-section nopadding cs-nomargin" style="padding-top: 70px; padding-bottom: 70px; margin: 0;">
        <div class="container">
            <div class="row">
                <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
                    <div class="user-dashboard loader-holder" style="width: 450px; min-height: auto; margin: 0 auto; background: #fff; padding: 40px; border-radius: 8px; box-shadow: 0 0 15px rgba(0,0,0,0.08);">
                        <div class="user-holder">
                            <h4 class="text-center" style="margin-bottom: 10px; font-weight: 600;">FORGOT YOUR PASSWORD?</h4>
                            <p class="text-center text-muted" style="font-size: 13px; margin-bottom: 25px;">
                                Enter your email address and we will send you a link to reset your password.
                            </p>

                            {% include 'includes/alerts.html' %}

                            <form action="{% url 'forgetPassword' %}" method="POST">
                                {% csrf_token %}
                                <div class="form-fields-set">
                                    <div class="row">
                                        <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
                                            <div class="field-holder" style="margin-bottom: 20px;">
                                                <label style="font-size: 13px; font-weight: 500; margin-bottom: 6px; display: block;">Email Address</label>
                                                <input type="email" name="email" class="form-control" placeholder="Enter your email address" required style="width: 100%; height: 45px; border-radius: 4px; border: 1px solid #ccc; padding: 10px;">
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
                                        <div class="field-holder">
                                            <div class="payment-holder">
                                                <input type="submit" value="SUBMIT" class="btn btn-info btn-block" style="width: 100%; height: 45px; background-color: #c33332; border-color: #c33332; color: #fff; font-weight: 600;">
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </form>
                            <div class="text-center" style="margin-top: 20px;">
                                <span style="font-size: 13px;">Remember your password? </span>
                                <a href="{% url 'login' %}" style="color: #c33332; font-weight: 600; font-size: 13px;">Login here</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% extends "base.html" %} {% block content %}

<style>
  .login-page {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 35px 15px 60px;
    background: #f7f7f7;
  }

  /* Login Card */
  .login-card {
    width: 100%;
    max-width: 500px;
    background: #ffffff;
    padding: 32px 40px;
    border-radius: 12px;
    box-shadow: 0 8px 35px rgba(0, 0, 0, 0.08);
  }

  /* Login Icon */
  .login-icon {
    width: 65px;
    height: 65px;
    margin: 0 auto 18px;
    border-radius: 50%;
    background: #ff5a5f;
    color: #ffffff;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 26px;
  }

  /* Heading */
  .login-card h3 {
    text-align: center;
    margin: 0;
    font-size: 27px;
    font-weight: 600;
    color: #333333;
  }

  .login-subtitle {
    text-align: center;
    color: #888888;
    margin: 8px 0 25px;
    font-size: 14px;
  }

  /* Form Field */
  .login-field {
    margin-bottom: 18px;
  }

  .login-field label {
    display: block;
    margin-bottom: 7px;
    font-weight: 600;
    color: #444444;
    font-size: 14px;
  }

  /* Input Wrapper */
  .input-wrapper {
    position: relative;
  }

  .input-wrapper .field-icon {
    position: absolute;
    left: 15px;
    top: 50%;
    transform: translateY(-50%);
    color: #aaaaaa;
    font-size: 16px;
    z-index: 2;
  }

  .login-field input {
    width: 100%;
    height: 47px;

    border: 1px solid #dddddd;
    border-radius: 6px;

    padding: 0 42px 0 42px; /* ডানে আইকনের জায়গার জন্য ডানপাশে padding বাড়ানো হয়েছে */

    font-size: 14px;
    outline: none;

    transition: all 0.3s ease;

    box-sizing: border-box;
  }

  .login-field input:focus {
    border-color: #ff5a5f;
    box-shadow: 0 0 0 3px rgba(255, 90, 95, 0.1);
  }

  /* Show/Hide Password Toggle */
  .toggle-password {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: #888888;
    font-size: 16px;
    cursor: pointer;
    user-select: none;
    z-index: 2;
    transition: color 0.2s ease;
  }

  .toggle-password:hover {
    color: #ff5a5f;
  }

  /* Forgot Password */
  .forgot-password {
    text-align: right;
    margin-top: -5px;
    margin-bottom: 20px;
  }

  .forgot-password a {
    color: #ff5a5f;
    font-size: 13px;
    text-decoration: none;
  }

  .forgot-password a:hover {
    text-decoration: underline;
  }

  .login-button {
    width: 100%;
    height: 48px;

    border: none;
    border-radius: 6px;

    background: #ff5a5f;
    color: #ffffff;

    font-size: 15px;
    font-weight: 600;

    cursor: pointer;

    transition: all 0.3s ease;
  }

  .login-button:hover {
    background: #e94b50;
    transform: translateY(-1px);
    box-shadow: 0 5px 15px rgba(255, 90, 95, 0.2);
  }

  /* Alerts */
  .login-alerts {
    margin-top: 18px;
  }

  /* Register Section */
  .login-footer {
    text-align: center;
    margin-top: 22px;

    color: #777777;
    font-size: 14px;
  }

  .login-footer a {
    color: #ff5a5f;
    font-weight: 600;
    text-decoration: none;
  }

  .login-footer a:hover {
    text-decoration: underline;
  }

  @media (max-width: 576px) {
    .login-page {
      padding: 25px 12px 45px;
    }

    .login-card {
      padding: 28px 22px;
    }

    .login-card h3 {
      font-size: 24px;
    }

    .login-icon {
      width: 60px;
      height: 60px;
      font-size: 24px;
    }
  }
</style>

<div class="login-page">
  <div class="login-card">
    <!-- Login Icon -->
    <div class="login-icon">
      <i class="icon-user"></i>
    </div>

    <!-- Heading -->
    <h3>Welcome Back!</h3>

    <p class="login-subtitle">
      Sign in to continue ordering your favorite food.
    </p>

    <!-- Login Form -->
    <form
      action="{% url 'login' %}"
      method="post"
      enctype="multipart/form-data"
      autocomplete="off"
      id="loginForm"
    >
      {% csrf_token %}

      <!-- Email -->
      <div class="login-field">
        <label for="email"> Email Address </label>

        <div class="input-wrapper">
          <i class="icon-mail field-icon"></i>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email address"
            autocomplete="off"
            required
          />
        </div>
      </div>

      <!-- Password -->
      <div class="login-field">
        <label for="password"> Password </label>

        <div class="input-wrapper">
          <i class="icon-lock field-icon"></i>

          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="new-password"
            required
          />

          <!-- Toggle Eye Button -->
          <i class="icon-eye toggle-password" id="togglePassword"></i>
        </div>
      </div>

      <!-- Forgot Password -->
      <div class="forgot-password">
        <a href="{% url 'forgetPassword' %}"> Forgot Password? </a>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="login-button">Sign In</button>
    </form>

    <!-- Django Messages -->
    <div class="login-alerts">{% include 'includes/alerts.html' %}</div>

    <!-- Register -->
    <div class="login-footer">
      Don't have an account?

      <a href="{% url 'registerUser' %}"> Create an account </a>
    </div>
  </div>
</div>

<script>
  // Show / Hide Password Toggle
  const togglePassword = document.getElementById("togglePassword");
  const passwordInput = document.getElementById("password");

  if (togglePassword && passwordInput) {
    togglePassword.addEventListener("click", function () {
      const isPassword = passwordInput.getAttribute("type") === "password";
      passwordInput.setAttribute("type", isPassword ? "text" : "password");

      // আপনার ব্যবহৃত আইকন লাইব্রেরি অনুযায়ী ক্লাস টগল (FontAwesome হলে 'fa-eye' / 'fa-eye-slash')
      this.classList.toggle("icon-eye");
      this.classList.toggle("icon-eye-off"); 
    });
  }

  // Clear Form on Page Refresh
  window.addEventListener("pageshow", function () {
    const email = document.getElementById("email");
    const password = document.getElementById("password");

    if (email) {
      email.value = "";
    }

    if (password) {
      password.value = "";
    }
  });
</script>

{% endblock %}
